# Secret scanning rules for this repo (gitleaks 8.30.1).
# Used by the pre-commit hook in .githooks/ and the "secrets" CI job.
# Real lab IPs, hostnames and credentials live only in the local, untracked
# Licenta/lab-local/ folder, never in git. Use placeholders such as <mac-lab-ip>.

title = "Feasibility-of-an-Open-Source-SIEM secret rules"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private (RFC 1918) IPv4 address. Real lab or home addresses must stay out of git."
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'''
keywords = ["10.", "172.", "192.168."]

[[rules.allowlists]]
description = "Documented placeholder subnet from the lab build guide, and synthetic test fixtures"
regexes = ['''^10\.10\.0\.\d{1,3}$''']
paths = ['''^tests/''']
