name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pin the ATT&CK version rule tags are validated against, so results are reproducible.
  ATTACK_VERSION: "19.2"
  ATTACK_DATA_BASE: https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: YAML lint
        run: yamllint .
      - name: Sigma rule validation
        env:
          SIGMA_ATTACK_DATA: ${{ env.ATTACK_DATA_BASE }}/enterprise-attack-${{ env.ATTACK_VERSION }}.json
        run: python -m detect.lint
      - name: Compose file validation
        run: docker compose config --quiet

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Rule and unit tests
        run: pytest -v

  migrations:
    # Applies db/migrations on a fresh PostgreSQL started from docker-compose.yml, then runs the
    # schema smoke test. A failing migration makes the container unhealthy and --wait fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL on a fresh volume
        run: docker compose up -d --wait postgres
      - name: Schema smoke test
        run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U siem -d siem < db/tests/smoke.sql
      - name: Container log on failure
        if: failure()
        run: docker compose logs postgres
