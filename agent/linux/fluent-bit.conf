# Fluent Bit agent for Linux (template). install.sh replaces the @...@ placeholders;
# the installed copy holds the token, so it is mode 600, owned by root.

[SERVICE]
    Flush                     1
    Log_Level                 info
    # Unsent events wait on disk while the Mac is asleep or ingest is down.
    storage.path              /var/lib/fluent-bit/buffer
    storage.sync              normal
    storage.backlog.mem_limit 5M

[INPUT]
    Name         tail
    Path         /var/log/audit/audit.log
    # Remembers the read offset, so a restart neither skips nor repeats lines.
    DB           /var/lib/fluent-bit/auditd.db
    Tag          auditd
    storage.type filesystem

[INPUT]
    Name         tail
    # Written by rsyslog; Kali logs only to journald without it.
    Path         /var/log/auth.log
    DB           /var/lib/fluent-bit/auth.db
    Tag          auth
    storage.type filesystem

[FILTER]
    Name   record_modifier
    Match  *
    Record host @AGENT_HOST@

[OUTPUT]
    Name                     http
    Match                    *
    Host                     @INGEST_HOST@
    Port                     @INGEST_PORT@
    URI                      /v1/events
    Format                   json
    Header                   Authorization Bearer @INGEST_TOKEN@
    Header_Tag               X-Fluent-Tag
    # Default is 1 retry, which would drop events after a short outage.
    Retry_Limit              no_limits
    # When full, Fluent Bit drops the oldest buffered chunks.
    storage.total_limit_size 500M
