# Fluent Bit agent for Windows (template). install.ps1 replaces the @...@ placeholders;
# the installed copy holds the token, so it is readable only by SYSTEM and Administrators.

[SERVICE]
    Flush                     1
    Log_Level                 info
    # Unsent events wait on disk while the Mac is asleep or ingest is down.
    storage.path              C:\ProgramData\fluent-bit\buffer
    storage.sync              normal
    storage.backlog.mem_limit 5M

# One input per channel, so a stall in one (see below) does not stop the other.
[INPUT]
    Name                winevtlog
    Channels            Security
    Interval_Sec        1
    # Remembers the last record read, so a restart neither skips nor repeats.
    DB                  C:\ProgramData\fluent-bit\security.db
    # Full event XML keeps EventData/UserData field names that Sigma rules use.
    Render_Event_As_XML On
    Tag                 windows
    storage.type        filesystem

# Observed 2026-11-23 (5.1.3): after `wevtutil cl Security` the input stops reading until
# the service restarts; install.ps1 adds a task that restarts it on event 1102 (decision D12).
[INPUT]
    Name                winevtlog
    Channels            Microsoft-Windows-Sysmon/Operational
    Interval_Sec        1
    DB                  C:\ProgramData\fluent-bit\sysmon.db
    Render_Event_As_XML On
    Tag                 windows
    storage.type        filesystem

[FILTER]
    Name   record_modifier
    Match  *
    Record host @AGENT_HOST@

[OUTPUT]
    Name                     http
    Match                    *
    Host                     @INGEST_HOST@
    Port                     @INGEST_PORT@
    URI                      /v1/events
    Format                   json
    Header                   Authorization Bearer @INGEST_TOKEN@
    Header_Tag               X-Fluent-Tag
    # Default is 1 retry, which would drop events after a short outage.
    Retry_Limit              no_limits
    # When full, Fluent Bit drops the oldest buffered chunks.
    storage.total_limit_size 500M
